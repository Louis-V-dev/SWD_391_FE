name: Build and deploy Node.js app to Azure Web App - greenloop-fe

defaults:
  run:
    working-directory: .

env:
  AZURE_WEBAPP_NAME: greenloop-fe
  NODE_VERSION: '20.x'
  ARTIFACT_NAME: next-app
  PACKAGE_FILE: release.zip

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify all required secrets are set
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          echo "🔍 Verifying environment variables..."
          
          # Check NEXT_PUBLIC_API_URL exists
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_API_URL is not set in GitHub Secrets!"
            exit 1
          fi
          
          # Check it's not localhost
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "localhost"; then
            echo "❌ ERROR: NEXT_PUBLIC_API_URL contains 'localhost'!"
            echo "Current value starts with: ${NEXT_PUBLIC_API_URL:0:30}..."
            exit 1
          fi
          
          # Check it's the backend URL (not frontend)
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "greenloop-fe"; then
            echo "❌ ERROR: NEXT_PUBLIC_API_URL points to FRONTEND instead of BACKEND!"
            echo ""
            echo "❌ Current (WRONG): greenloop-fe-xxx (frontend URL)"
            echo "✅ Should be: greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net (backend URL)"
            echo ""
            echo "Please update the secret in GitHub Settings > Secrets > Actions"
            exit 1
          fi
          
          # Verify it's the correct backend domain
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "greenloop-heb0bffxh4h4e0hy"; then
            echo "✅ API URL points to correct backend"
          else
            echo "⚠️ WARNING: API URL doesn't match expected backend domain"
            echo "Expected: greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net"
          fi
          
          # Check other vars (warnings only)
          if [ -z "$NEXT_PUBLIC_WS_URL" ]; then
            echo "⚠️ WARNING: NEXT_PUBLIC_WS_URL is not set"
          fi
          
          if [ -z "$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" ]; then
            echo "⚠️ WARNING: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME is not set"
          fi
          
          if [ -z "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" ]; then
            echo "⚠️ WARNING: NEXT_PUBLIC_GOOGLE_CLIENT_ID is not set"
          fi
          
          echo ""
          echo "✅ All critical environment variables verified"
          echo "🎯 Backend API: $(echo $NEXT_PUBLIC_API_URL | sed 's|https\?://||' | cut -d'/' -f1)"
      
      - name: Check for problematic .env files
        run: |
          echo "🔍 Checking for .env files that could override secrets..."
          
          # .env.local should NEVER be in repo
          if [ -f .env.local ]; then
            echo "❌ ERROR: .env.local file found in repository!"
            echo "This file should be in .gitignore and NOT committed!"
            echo ""
            echo "To fix:"
            echo "  git rm --cached .env.local"
            echo "  echo '.env.local' >> .gitignore"
            echo "  git commit -m 'Remove .env.local from repo'"
            exit 1
          fi
          
          # .env.production would override secrets - should not exist
          if [ -f .env.production ]; then
            echo "⚠️ WARNING: .env.production found - this will override GitHub Secrets!"
            echo "Since you're using only GitHub Secrets, consider removing this file."
            echo ""
            cat .env.production
            echo ""
          fi
          
          # .env.*.local should not be committed
          if ls .env.*.local 1> /dev/null 2>&1; then
            echo "❌ ERROR: .env.*.local files found in repository!"
            ls -la .env.*.local
            exit 1
          fi
          
          echo "✅ No problematic .env files found"
      
      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_CLOUDINARY_API_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NODE_ENV: production
        run: |
          echo "🏗️ Building Next.js application for production..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          npm run build
          echo "✅ Build completed successfully"
      
      - name: Verify build output
        run: |
          echo "🔍 Verifying build artifacts..."
          
          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next directory not found!"
            exit 1
          fi
          
          if [ ! -d ".next/standalone" ]; then
            echo "❌ ERROR: .next/standalone directory not found!"
            echo ""
            echo "Make sure your next.config.js contains:"
            echo "  output: 'standalone'"
            exit 1
          fi
          
          if [ ! -d ".next/static" ]; then
            echo "❌ ERROR: .next/static directory not found!"
            exit 1
          fi
          
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "❌ ERROR: server.js not found in standalone build!"
            exit 1
          fi
          
          echo "✅ All build artifacts verified"
          echo "📦 Build size: $(du -sh .next | cut -f1)"
      
      - name: Prepare standalone bundle
        run: |
          echo "📦 Preparing deployment bundle..."
          
          # Create deploy directory
          mkdir -p deploy
          
          # Copy standalone server files
          cp -R .next/standalone/* deploy/
          
          # Copy static files
          mkdir -p deploy/.next/static
          cp -R .next/static deploy/.next/static
          
          # Copy public folder if exists
          if [ -d "public" ]; then 
            cp -R public deploy/public
          fi
          
          # Create minimal package.json for Azure
          cat > deploy/package.json << 'EOF'
          {
            "name": "greenloop-fe",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF
          
          # Create deployment zip
          cd deploy
          zip -r ../${{ env.PACKAGE_FILE }} . -q
          cd ..
          
          echo "✅ Deployment package created: $(ls -lh ${{ env.PACKAGE_FILE }} | awk '{print $5}')"
      
      - name: Clean up temporary files
        run: rm -rf deploy
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_FILE }}
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
      
      - name: Verify artifact
        run: |
          echo "📦 Verifying deployment artifact..."
          if [ ! -f "${{ env.PACKAGE_FILE }}" ]; then
            echo "❌ ERROR: Deployment package not found!"
            exit 1
          fi
          ls -lh ${{ env.PACKAGE_FILE }}
          echo "✅ Artifact verified"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_932E0693B50F4572AEDF16A477F534AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BDDA74B6D67459DAB70E4A798ECC0CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14074202807C4F48928A475E333A61AB }}
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_FILE }}
      
      - name: Deployment summary
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🚀 Deployment Completed Successfully!"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "📱 Application: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "🌐 Frontend URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "🔧 Backend API: https://greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net"
          echo ""
          echo "⏰ Please wait 2-3 minutes for the application to fully start"
          echo "📊 Monitor at: https://portal.azure.com"
          echo ""
          echo "════════════════════════════════════════════════════════"
```

## Now do this:

### 1. Update GitHub Secrets (MOST IMPORTANT!)

Go to: **GitHub repo** → **Settings** → **Secrets and variables** → **Actions**

Make sure `NEXT_PUBLIC_API_URL` is set to:
```
