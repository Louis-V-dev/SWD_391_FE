# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - greenloop-fe

defaults:
  run:
    working-directory: .

env:
  AZURE_WEBAPP_NAME: greenloop-fe
  NODE_VERSION: '20.x'
  ARTIFACT_NAME: next-app
  PACKAGE_FILE: release.zip

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: https://greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net
          NEXT_PUBLIC_API_BASE_URL: https://greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net
          NEXT_PUBLIC_WS_URL: wss://greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net/api/ws
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1093884420538-ka17a3efctfkv117f1lqotu4uusgokn9.apps.googleusercontent.com
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dmpjc496u
          NEXT_PUBLIC_CLOUDINARY_API_KEY: 867162548936863
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ml_default
        run: npm run build
      
      - name: Prepare standalone bundle
        run: |
          mkdir -p deploy
          cp -R .next/standalone/* deploy/
          mkdir -p deploy/.next/static
          cp -R .next/static deploy/.next/static
          if [ -d "public" ]; then 
            cp -R public deploy/public
          fi
          echo '{"scripts":{"start":"node server.js"}}' > deploy/package.json
          cd deploy
          zip -r ../${{ env.PACKAGE_FILE }} .
      
      - name: Clean up temporary bundle
        run: rm -rf deploy
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_FILE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_932E0693B50F4572AEDF16A477F534AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BDDA74B6D67459DAB70E4A798ECC0CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14074202807C4F48928A475E333A61AB }}
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_FILE }}
