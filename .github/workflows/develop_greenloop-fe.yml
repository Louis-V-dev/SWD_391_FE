name: Build and deploy Node.js app to Azure Web App - greenloop-fe

defaults:
  run:
    working-directory: .

env:
  AZURE_WEBAPP_NAME: greenloop-fe
  NODE_VERSION: '20.x'
  ARTIFACT_NAME: next-app
  PACKAGE_FILE: release.zip

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Clean previous builds
        run: |
          echo "Cleaning any previous build artifacts..."
          rm -rf .next
          rm -rf out
          rm -rf node_modules/.cache
          echo "Clean completed"
      
      - name: Verify all required secrets are set
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          echo "Verifying environment variables..."
          
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_API_URL is not set in GitHub Secrets!"
            exit 1
          fi
          
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "localhost"; then
            echo "ERROR: NEXT_PUBLIC_API_URL contains localhost!"
            exit 1
          fi
          
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "greenloop-fe"; then
            echo "ERROR: NEXT_PUBLIC_API_URL points to FRONTEND instead of BACKEND!"
            echo "Should be: greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net"
            exit 1
          fi
          
          if echo "$NEXT_PUBLIC_API_URL" | grep -q "greenloop-heb0bffxh4h4e0hy"; then
            echo "API URL points to correct backend"
          fi
          
          echo "All critical environment variables verified"
      
      - name: Check for problematic env files
        run: |
          echo "Checking for .env files..."
          
          if [ -f .env.local ]; then
            echo "ERROR: .env.local file found in repository!"
            echo "This file should NOT be committed!"
            exit 1
          fi
          
          if [ -f .env.production ]; then
            echo "WARNING: .env.production found"
            cat .env.production
          fi
          
          echo "No problematic .env files found"
      
      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_CLOUDINARY_API_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NODE_ENV: production
        run: |
          echo "Building Next.js application..."
          echo "Environment variables that will be BAKED into the bundle:"
          echo "  NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"
          echo "  NEXT_PUBLIC_WS_URL: $NEXT_PUBLIC_WS_URL"
          echo "  NODE_ENV: $NODE_ENV"
          npm run build
          echo "Build completed successfully"
      
      - name: Verify built bundle doesn't contain localhost
        run: |
          echo "Searching for localhost references in built JavaScript..."
          
          # Search for localhost in the built files
          if grep -r "localhost:8080" .next/static 2>/dev/null; then
            echo "❌ ERROR: Found localhost:8080 in built bundle!"
            echo "This means environment variables were not properly set during build."
            exit 1
          fi
          
          if grep -r "http://localhost" .next/static 2>/dev/null | grep -v "sourceMappingURL" | grep -q .; then
            echo "⚠️ WARNING: Found localhost references in built bundle"
            echo "Verify this is intentional"
          fi
          
          echo "✅ No problematic localhost references found in build output"
      
      - name: Verify build output
        run: |
          echo "Verifying build artifacts..."
          
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found!"
            exit 1
          fi
          
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone directory not found!"
            echo "Make sure next.config.js has: output: 'standalone'"
            exit 1
          fi
          
          if [ ! -d ".next/static" ]; then
            echo "ERROR: .next/static directory not found!"
            exit 1
          fi
          
          echo "All build artifacts verified"
      
      - name: Prepare standalone bundle
        run: |
          echo "Preparing deployment bundle..."
          mkdir -p deploy
          
          # Copy standalone server files
          cp -R .next/standalone/* deploy/
          
          # Copy the ENTIRE .next folder to deploy/.next (includes server/, static/, etc.)
          mkdir -p deploy/.next
          cp -R .next/standalone/.next/* deploy/.next/ 2>/dev/null || true
          
          # Copy static files (overwrite if exists)
          cp -R .next/static deploy/.next/static
          
          # Copy public folder
          if [ -d "public" ]; then 
            cp -R public deploy/public
          fi
          
          # Add timestamp to force Azure to recognize new deployment
          TIMESTAMP=$(date +%s)
          echo '{"name":"greenloop-fe","version":"1.0.'$TIMESTAMP'","scripts":{"start":"node server.js"}}' > deploy/package.json
          echo "Build timestamp: $TIMESTAMP" > deploy/BUILD_INFO.txt
          
          echo "Verifying deployment structure..."
          ls -la deploy/
          ls -la deploy/.next/ || echo "Warning: .next directory structure may be incomplete"
          
          cd deploy
          zip -r ../${{ env.PACKAGE_FILE }} . -q
          cd ..
          echo "Deployment package created with timestamp: $TIMESTAMP"
      
      - name: Clean up temporary files
        run: rm -rf deploy
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_FILE }}
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
      
      - name: Verify artifact
        run: |
          echo "Verifying deployment artifact..."
          if [ ! -f "${{ env.PACKAGE_FILE }}" ]; then
            echo "ERROR: Deployment package not found!"
            exit 1
          fi
          ls -lh ${{ env.PACKAGE_FILE }}
          echo "Artifact verified"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_932E0693B50F4572AEDF16A477F534AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BDDA74B6D67459DAB70E4A798ECC0CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14074202807C4F48928A475E333A61AB }}
      
      - name: Get Resource Group
        id: get-rg
        run: |
          RG=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --query resourceGroup -o tsv)
          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          echo "Found resource group: $RG"
      
      - name: Stop Azure Web App (force clean deployment)
        run: |
          echo "Stopping Azure Web App to ensure clean deployment..."
          az webapp stop --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ steps.get-rg.outputs.resource_group }} || true
          echo "Web App stopped"
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_FILE }}
          clean: true
      
      - name: Start Azure Web App
        run: |
          echo "Starting Azure Web App with new deployment..."
          az webapp start --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ steps.get-rg.outputs.resource_group }} || true
          sleep 5
          echo "Restarting to ensure fresh start..."
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ steps.get-rg.outputs.resource_group }}
          echo "Web App started successfully"
      
      - name: Deployment summary
        run: |
          echo "Deployment Completed!"
          echo "Application: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "Frontend URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Backend API: https://greenloop-heb0bffxh4h4e0hy.canadacentral-01.azurewebsites.net"
          echo ""
          echo "🔍 IMPORTANT: Verify the deployment:"
          echo "1. Wait 2-3 minutes for the application to start"
          echo "2. Visit: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/env-check"
          echo "3. Verify that the API URL does NOT contain localhost"
          echo "4. If it still shows localhost, check GitHub Actions logs for build issues"
          echo ""
          echo "🧹 If issues persist:"
          echo "- Clear browser cache (Ctrl+Shift+R or Cmd+Shift+R)"
          echo "- Check Azure Web App logs"
          echo "- Restart Azure Web App"
